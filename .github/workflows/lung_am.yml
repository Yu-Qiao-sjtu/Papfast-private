name: PubMed - Lung-AM

on:
  schedule:
    - cron: '30 0 * * *'    # UTC 00:30 = 北京 08:30
  workflow_dispatch:

jobs:
  pubmed-lung-am:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install biopython deep-translator requests

      - name: Run PubMed fetcher
        env:
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python pubmed_fetcher.py --config config_lung_am

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_config_lung_am.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "update state_lung_am $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
